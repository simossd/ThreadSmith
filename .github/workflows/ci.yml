name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Rebuild with ThreadSanitizer
        run: |
          make fclean
          make CFLAGS="-Wall -Wextra -Werror -pthread -fsanitize=thread -g"

      - name: Smoke test
        run: ./threadsmith 5 3000 200 200 200 3 400 fifo